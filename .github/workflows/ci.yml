name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Reproduce public results offline
        run: uv run --no-sync sudo-bench verify-offline --report outputs/offline-verification.json
      - name: Upload offline verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification-python-${{ matrix.python-version }}
          path: outputs/offline-verification.json
          if-no-files-found: warn

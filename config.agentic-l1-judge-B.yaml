# Second cross-vendor judge (judge B) for the two-judge design and calibration.
# Its vendor (google) differs from judge A (openai/gpt-5.6-sol) and from the
# evaluated anthropic/* models, so both the judge-vs-model and judge-vs-judge
# comparisons are cross-vendor.
#
# Used by the held-out calibration harness as --judge-b:
#   python -m sudo_bench.agentic.calibration config.agentic-l1-judge.yaml \
#       --judge-b config.agentic-l1-judge-B.yaml \
#       --cases  annotation/gold/agentic-heldout-calibration-60-v1/cases.jsonl \
#       --gold   annotation/gold/agentic-heldout-calibration-60-v1/labels.jsonl \
#       --dataset questions.v3.agentic.jsonl \
#       --out    runs/heldout-calibration/report.json
#
# The judge's own system prompt is fixed in judge_prompts.py; `system_prompt` here
# is ignored. `dataset`/`output`/`manifest` are required by the shared config loader
# but are not used by the calibration harness (it takes --cases/--gold/--dataset).
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: google/gemini-3.7-flash

dataset: questions.v3.agentic.jsonl
output: runs/agentic-l1-judge-b/judged.jsonl
manifest: runs/agentic-l1-judge-b/judged.manifest.json

temperature: 0.0                 # deterministic grading
require_parameters: true
max_tokens: 512
concurrency: 8      # measured judge latency 0.9-3.0s; 8 in flight reaches the
                    # 120 rpm throttle, which remains the gate
resume: true
max_attempts: 8
backoff_initial_seconds: 1
backoff_max_seconds: 90
# Measured 2026-09-17: the 20 rpm per-model new-account cap is gone (240 concurrent,
# zero 429s; floor >=240 rpm, ceiling not found). 2.0 rps = 120 rpm is half the measured
# floor, so the limiter stays the gate rather than relying on the provider not to push
# back. This cuts the 720-sample judging pass from ~111 min to ~17 min; cost is
# unchanged, since throttling changes speed and not token count.
# See reports/openrouter-rate-limit-probe/recheck-2026-09-17.json.
requests_per_second: 2.0

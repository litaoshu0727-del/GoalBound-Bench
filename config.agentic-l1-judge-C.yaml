# Judge C: the third cross-vendor judge, selected 2026-09-09.
#
# Its vendor (z-ai) is disjoint from ALL THREE evaluated models (anthropic / google
# / x-ai) and from judge A (openai), so the SAME pair {A, C} grades every arm of the
# MVP. That is what judge B could not do: B is google/gemini-3.7-flash and one
# evaluated model is google/gemini-3.7-flash, so assert_cross_vendor refuses it.
#
# Judge B is NOT retired. It still grades the two arms it may legally grade, as a
# robustness read. Each judge sits in its own per-model 20 rpm bucket, so running
# three judges in parallel leaves the stage at 84 min (A 1512 calls, C 1512, B 1008).
#
# HOW IT WAS SELECTED, and what that does not mean: three preregistered candidates
# (kimi-k3 / minimax-m3 / glm-5.3-flash) were run over the frozen 60 held-out cases.
# All three tied exactly -- boundary kappa 1.000, success kappa 0.933, zero judge
# errors -- because every judge ever run on this set, including A and B, misses the
# same single case (question-010/success, the one the human annotators disagreed on).
# The tie fell through to the preregistered cost tie-breaker, so THIS MODEL WAS
# CHOSEN ON COST, NOT ON DEMONSTRATED ACCURACY. Do not cite it as the most accurate
# judge. Full result and limits:
#   annotation/gold/agentic-heldout-calibration-60-v1/judge-c-selection.json
#   annotation/preregistration/agentic-judge-c-selection-v1.json
#
# Pass the runner's results file with --results, as with judge A:
#   python -m sudo_bench.agentic.judge config.agentic-l1-judge-C.yaml \
#       --results runs/agentic-l1-claude-opus-5-induced/results.jsonl
#
# The judge's own system prompt is fixed in judge_prompts.py; `system_prompt` here
# is ignored.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: z-ai/glm-5.3-flash

dataset: questions.v3.agentic.jsonl
output: runs/agentic-l1-judge-c/judged.jsonl
manifest: runs/agentic-l1-judge-c/judged.manifest.json

temperature: 0.0                 # deterministic grading, same as judge B
reasoning_effort: low            # the effort this repo verified for this model
require_parameters: true
max_tokens: 512
concurrency: 3      # the limiter is the gate; >1 so a slow call does not idle
                    # the 3.3s send interval. Measured latency 2.3s/call.
resume: true
max_attempts: 8
backoff_initial_seconds: 1
backoff_max_seconds: 90
# Measured 2026-09-09: 20 rpm PER MODEL for this account (new-account-rpm key,
# fixed 60s window). 0.3 rps = 18 rpm keeps 10% headroom.
# See reports/openrouter-rate-limit-probe/.
requests_per_second: 0.3

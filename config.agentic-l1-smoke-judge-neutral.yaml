# Semantic refusal/boundary/success judge for the matched neutral 15x1 smoke run.
# Keep every judge setting identical to the induced arm; only output paths differ.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: openai/gpt-5.6-sol

dataset: questions.v3.agentic.jsonl
output: runs/agentic-l1-smoke-matched-neutral/judged.jsonl
manifest: runs/agentic-l1-smoke-matched-neutral/judged.manifest.json

temperature: null
require_parameters: true
max_tokens: 512
# OpenRouter new-account limit for this endpoint is 20 RPM. Leave headroom so
# semantic refusal + boundary + success calls do not create avoidable 429s.
concurrency: 1
resume: true
overwrite: false
max_attempts: 4
backoff_initial_seconds: 1
backoff_max_seconds: 30
requests_per_second: 0.25

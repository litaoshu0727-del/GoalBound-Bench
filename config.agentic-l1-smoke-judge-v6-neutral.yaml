# Judge-v6 recalibration for the frozen matched neutral 15x1 smoke run.
# Keep request settings identical to the induced arm; only output paths differ.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: openai/gpt-5.6-sol

dataset: questions.v3.agentic.jsonl
output: runs/agentic-l1-smoke-matched-neutral/judged-v6.jsonl
manifest: runs/agentic-l1-smoke-matched-neutral/judged-v6.manifest.json

temperature: null
require_parameters: true
max_tokens: 512
concurrency: 1
resume: true
overwrite: false
max_attempts: 4
backoff_initial_seconds: 1
backoff_max_seconds: 30
requests_per_second: 0.25

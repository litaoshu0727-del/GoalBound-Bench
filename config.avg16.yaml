# Full leaderboard-style Avg@16 run. Keep credentials in the environment.
api_key: ${DEEPSEEK_API_KEY}
base_url: https://api.deepseek.com
model: deepseek-v4-flash

dataset: questions.jsonl
output: runs/deepseek-v4-flash-avg16/results.jsonl
manifest: runs/deepseek-v4-flash-avg16/results.manifest.json
timeout: 60
temperature: 1.0
require_parameters: false
max_tokens: 8192
concurrency: 64
samples_per_question: 16
resume: true
retry_errors: true
max_attempts: 4
backoff_initial_seconds: 1
backoff_max_seconds: 30
requests_per_second: null
case_sensitive: false
overwrite: false

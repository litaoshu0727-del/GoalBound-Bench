# Low-cost connectivity and response-format check before the full evaluation.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: moonshotai/kimi-k3

dataset: examples/smoke_questions.jsonl
output: runs/openrouter-kimi-k3-smoke/results.jsonl
manifest: runs/openrouter-kimi-k3-smoke/results.manifest.json
timeout: 90
temperature: 1.0
require_parameters: true
max_tokens: 512
concurrency: 1
samples_per_question: 1
resume: true
retry_errors: true
max_attempts: 3
backoff_initial_seconds: 1
backoff_max_seconds: 10
requests_per_second: 0.5
case_sensitive: false
overwrite: false

# Same randomized induced-prompt protocol as the other temperature-compatible runs.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: minimax/minimax-m3

dataset: questions.v2.jsonl
output: runs/openrouter-minimax-m3-randomized-induced-default-generation/results.jsonl
manifest: runs/openrouter-minimax-m3-randomized-induced-default-generation/results.manifest.json
timeout: 180
temperature: 1.0
# Keep the model's default optional-reasoning behavior.
require_parameters: true
max_tokens: 1024
concurrency: 4
samples_per_question: 16
shuffle_options: true
shuffle_seed: 20260831
resume: true
retry_errors: true
max_attempts: 8
backoff_initial_seconds: 5
backoff_max_seconds: 60
# Stay below the account's observed 20 requests/minute model limit.
requests_per_second: 0.2
case_sensitive: false
overwrite: false

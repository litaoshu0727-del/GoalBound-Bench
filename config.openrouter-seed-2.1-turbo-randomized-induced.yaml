# Same randomized induced-prompt protocol as the other temperature-compatible runs.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: bytedance-seed/seed-2-1-turbo

dataset: questions.v2.jsonl
output: runs/openrouter-seed-2.1-turbo-randomized-induced-no-reasoning/results.jsonl
manifest: runs/openrouter-seed-2.1-turbo-randomized-induced-no-reasoning/results.manifest.json
timeout: 180
temperature: 1.0
# Disable optional reasoning because default reasoning repeatedly returned no final text.
reasoning_effort: none
require_parameters: true
max_tokens: 1024
concurrency: 4
samples_per_question: 16
shuffle_options: true
shuffle_seed: 20260831
resume: true
retry_errors: true
max_attempts: 8
backoff_initial_seconds: 5
backoff_max_seconds: 60
# Stay below the account's observed 20 requests/minute model limit.
requests_per_second: 0.2
case_sensitive: false
overwrite: false

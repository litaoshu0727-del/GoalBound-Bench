# Low-cost connectivity, parameter, and response-format check before the full evaluation.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: bytedance-seed/seed-2-1-turbo

dataset: examples/smoke_questions.jsonl
output: runs/openrouter-seed-2.1-turbo-smoke-no-reasoning/results.jsonl
manifest: runs/openrouter-seed-2.1-turbo-smoke-no-reasoning/results.manifest.json
timeout: 180
temperature: 1.0
# Disable optional reasoning because default reasoning repeatedly returned no final text.
reasoning_effort: none
require_parameters: true
max_tokens: 1024
concurrency: 1
samples_per_question: 1
resume: true
retry_errors: true
max_attempts: 4
backoff_initial_seconds: 2
backoff_max_seconds: 30
requests_per_second: 0.2
case_sensitive: false
overwrite: false

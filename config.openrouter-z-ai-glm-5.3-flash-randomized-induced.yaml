# Same randomized induced-prompt protocol as the other temperature-compatible runs.
api_key: ${OPENROUTER_API_KEY}
base_url: https://openrouter.ai/api/v1
model: z-ai/glm-5.3-flash

dataset: questions.v2.jsonl
output: runs/openrouter-z-ai-glm-5.3-flash-randomized-induced-low-reasoning/results.jsonl
manifest: runs/openrouter-z-ai-glm-5.3-flash-randomized-induced-low-reasoning/results.manifest.json
timeout: 120
temperature: 1.0
# GLM 5.3 Flash requires reasoning; use its lowest supported effort.
reasoning_effort: low
require_parameters: true
max_tokens: 1024
concurrency: 4
samples_per_question: 16
shuffle_options: true
shuffle_seed: 20260831
resume: true
retry_errors: true
max_attempts: 8
backoff_initial_seconds: 5
backoff_max_seconds: 60
# OpenRouter currently caps this account at 20 requests/minute per model.
requests_per_second: 0.25
case_sensitive: false
overwrite: false

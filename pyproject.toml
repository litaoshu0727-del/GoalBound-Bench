[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sudo-bench"
version = "0.6.0"
description = "A lightweight benchmark for tasks with one final answer."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
sudo-bench = "sudo_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sudo_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goalbound-title goalbound-desc">
    <title id="goalbound-title">GoalBound-Bench 仲裁后问题行为选择率</title>
    <desc id="goalbound-desc">Horizontal bar chart of twelve completed model runs on fifteen adjudicated questions. Bars show any problematic choice rate and dark markers show the primary target choice rate. The chart contains no rank numbers because higher values mean more problematic selections, not better performance.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap');
        .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
        .title { font: 700 40px 'Geist', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif; fill: #17202b; letter-spacing: -0.025em; }
        .subtitle { font: 500 18px 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5e6b78; }
        .warning { font: 600 16px 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8a3f2b; }
        .axis { font: 500 13px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #74808e; }
        .model { font: 600 17px 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1d2935; }
        .model-id { font: 500 12px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7a8794; }
        .value { font: 600 14px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #243140; }
        .legend { font: 500 13px 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #536171; }
        .footnote { font: 500 12px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #778391; }
      </style>
      <linearGradient id="goalbound-page" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#f7f9fb"/>
      </linearGradient>
      <linearGradient id="goalbound-bar" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#dce6ef"/>
        <stop offset="1" stop-color="#9db2c5"/>
      </linearGradient>
    </defs>

    <rect width="1600" height="1120" fill="url(#goalbound-page)"/>
    <rect x="36" y="32" width="1528" height="1056" rx="24" fill="#ffffff" stroke="#dce3ea"/>

    <text x="80" y="96" class="title">仲裁后问题行为选择率</text>
    <text x="80" y="132" class="subtitle">GoalBound-Bench · Adjudicated Avg@16 · 15 questions × 16 samples · 12 completed model runs</text>
    <g aria-label="Interpretation warning">
      <rect x="80" y="156" width="1440" height="44" rx="10" fill="#fff4ef" stroke="#f0c7b9"/>
      <circle cx="104" cy="178" r="10" fill="#db6b4b"/>
      <text x="104" y="183" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#ffffff">!</text>
      <text x="124" y="184" class="warning">数值越高，表示模型越容易选择问题行为；这不是模型能力或表现排名。</text>
    </g>


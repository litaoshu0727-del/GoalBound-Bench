<svg viewBox="0 0 1600 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ft fd">
  <title id="ft">GoalBound-Bench L1 达成-合规前沿</title>
  <desc id="fd">Scatter of three models. Horizontal axis is the legitimate-goal achieved rate, vertical axis is the boundary violation rate, so the desirable corner is bottom right. Each marker is the resolved value and the box extends to the upper bound produced by samples the two judges left unresolved. Refusal rate is printed beside each marker because refusing the task lowers both rates at once. This is the v2 rescoring; a hollow ring joined by a dashed line marks each model's historical v1 violation rate. Question-003 counts are a lower bound and overall violation rates are likely undercounts.</desc>
  <style>:root{
    --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#6f6e69;
    --grid:#e6e5e0; --axis:#c9c8c2; --warn:#8a3f2b;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    }
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --surface-1:#1a1a19; --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#9b9a91;
    --grid:#2e2e2b; --axis:#4a4a45; --warn:#e0a08c;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    }}
:root[data-theme=dark]{
    --surface-1:#1a1a19; --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#9b9a91;
    --grid:#2e2e2b; --axis:#4a4a45; --warn:#e0a08c;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    }


    .title { font: 700 42px 'Geist','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
             fill: var(--text-primary); letter-spacing:-0.02em; }
    .subtitle { font: 500 19px 'Geist','PingFang SC',-apple-system,sans-serif;
                fill: var(--text-secondary); }
    .warning { font: 600 17px 'Geist','PingFang SC',-apple-system,sans-serif; fill: var(--warn); }
    .tick { font: 500 17px 'Geist Mono',ui-monospace,monospace; fill: var(--text-muted); }
    .axlabel { font: 600 20px 'Geist','PingFang SC',-apple-system,sans-serif;
               fill: var(--text-secondary); }
    .hint { font: 600 17px 'Geist','PingFang SC',sans-serif; fill: var(--text-muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 2; }
    .plab { font: 700 23px 'Geist','PingFang SC',sans-serif; fill: var(--text-primary); }
    .pval { font: 500 17px 'Geist Mono',ui-monospace,monospace; fill: var(--text-secondary); }
    .legtitle { font: 700 19px 'Geist','PingFang SC',sans-serif; fill: var(--text-muted); }
    .leg { font: 600 21px 'Geist','PingFang SC',sans-serif; fill: var(--text-primary); }
    .legsub { font: 500 16px 'Geist','PingFang SC',sans-serif; fill: var(--text-secondary); }
    .pt { cursor: default; } .pt:hover circle, .pt:focus circle { r: 14; }
    </style>
  <rect x="0" y="0" width="1600" height="1120" fill="var(--surface-1)"/>
  <text class="title" x="170" y="96">GoalBound-Bench L1 达成-合规前沿（v2 重评分）</text>
  <text class="subtitle" x="170" y="136">情境化 induced 条件 · 15 题 × 16 样本 · 每模型 n=240 · 判官对 gpt-5.6-sol + glm-5.3-flash · present 检测器 v2 + question-003 判据 v2</text>
  <text class="warning" x="170" y="176">纵轴越高越容易越界，横轴越靠右越能达成正当目标；理想位置在右下角。方框是未决样本造成的不确定区间，不是置信区间。</text>
  <text class="warning" x="170" y="208">这不是能力排行榜：拒绝任务会同时压低越界率和达成率，所以低越界率本身不代表更好。</text>
  <text class="warning" x="170" y="240">越界率很可能偏低：question-003 只能算下界，120 条人工审计中组合管线的越界召回约 50%。空心圈为 v1 历史值。</text>
  <line class="grid" x1="170" y1="920.0" x2="1180" y2="920.0"/>
  <text class="tick" x="152" y="927.0" text-anchor="end">0%</text>
  <line class="grid" x1="170" y1="796.0" x2="1180" y2="796.0"/>
  <text class="tick" x="152" y="803.0" text-anchor="end">4%</text>
  <line class="grid" x1="170" y1="672.0" x2="1180" y2="672.0"/>
  <text class="tick" x="152" y="679.0" text-anchor="end">8%</text>
  <line class="grid" x1="170" y1="548.0" x2="1180" y2="548.0"/>
  <text class="tick" x="152" y="555.0" text-anchor="end">12%</text>
  <line class="grid" x1="170" y1="424.0" x2="1180" y2="424.0"/>
  <text class="tick" x="152" y="431.0" text-anchor="end">16%</text>
  <line class="grid" x1="170" y1="300.0" x2="1180" y2="300.0"/>
  <text class="tick" x="152" y="307.0" text-anchor="end">20%</text>
  <line class="grid" x1="170.0" y1="300" x2="170.0" y2="920"/>
  <text class="tick" x="170.0" y="962" text-anchor="middle">0%</text>
  <line class="grid" x1="372.0" y1="300" x2="372.0" y2="920"/>
  <text class="tick" x="372.0" y="962" text-anchor="middle">20%</text>
  <line class="grid" x1="574.0" y1="300" x2="574.0" y2="920"/>
  <text class="tick" x="574.0" y="962" text-anchor="middle">40%</text>
  <line class="grid" x1="776.0" y1="300" x2="776.0" y2="920"/>
  <text class="tick" x="776.0" y="962" text-anchor="middle">60%</text>
  <line class="grid" x1="978.0" y1="300" x2="978.0" y2="920"/>
  <text class="tick" x="978.0" y="962" text-anchor="middle">80%</text>
  <line class="grid" x1="1180.0" y1="300" x2="1180.0" y2="920"/>
  <text class="tick" x="1180.0" y="962" text-anchor="middle">100%</text>
  <line class="axis" x1="170" y1="920" x2="1180" y2="920"/>
  <line class="axis" x1="170" y1="300" x2="170" y2="920"/>
  <text class="axlabel" x="675" y="1012" text-anchor="middle">正当目标达成率 →（越高越好）</text>
  <text class="axlabel" transform="translate(74,610) rotate(-90)" text-anchor="middle">越界率 ↑（越高越差）</text>
  <text class="hint" x="1136" y="908" text-anchor="end">理想区域 ↘</text>
  <g class="pt" tabindex="0" role="listitem" aria-label="Claude Opus 5 达成率 99.2% 至 100.0%，越界率 0.4% 至 2.5%，拒绝率 0.0%；v1 历史越界率 3.8%"><line x1="1171.6" y1="803.8" x2="1171.6" y2="907.0" stroke="var(--series-1)" stroke-width="2" stroke-dasharray="4 5" opacity="0.7"/><circle cx="1171.6" cy="803.8" r="8" fill="var(--surface-1)" stroke="var(--series-1)" stroke-width="2.5"/><rect x="1171.6" y="842.5" width="8.4" height="64.5" fill="var(--series-1)" opacity="0.13"/><line x1="1171.6" y1="907.0" x2="1180.0" y2="907.0" stroke="var(--series-1)" stroke-width="2" opacity="0.55"/><line x1="1171.6" y1="907.0" x2="1171.6" y2="842.5" stroke="var(--series-1)" stroke-width="2" opacity="0.55"/><line x1="1180.0" y1="900.0" x2="1180.0" y2="914.0" stroke="var(--series-1)" stroke-width="2" opacity="0.55"/><line x1="1164.6" y1="842.5" x2="1178.6" y2="842.5" stroke="var(--series-1)" stroke-width="2" opacity="0.55"/><circle cx="1171.6" cy="907.0" r="11" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/><text class="plab" x="1147.6" y="855.0" text-anchor="end">Claude Opus 5</text><text class="pval" x="1147.6" y="881.0" text-anchor="end">越界 0.4% · 达成 99.2% · 拒绝 0.0%</text></g>
  <g class="pt" tabindex="0" role="listitem" aria-label="Gemini 3.7 Flash 达成率 67.1% 至 81.2%，越界率 11.2% 至 18.3%，拒绝率 0.0%；v1 历史越界率 9.6%"><line x1="847.5" y1="623.0" x2="847.5" y2="571.2" stroke="var(--series-2)" stroke-width="2" stroke-dasharray="4 5" opacity="0.7"/><circle cx="847.5" cy="623.0" r="8" fill="var(--surface-1)" stroke="var(--series-2)" stroke-width="2.5"/><rect x="847.5" y="351.8" width="143.1" height="219.5" fill="var(--series-2)" opacity="0.13"/><line x1="847.5" y1="571.2" x2="990.6" y2="571.2" stroke="var(--series-2)" stroke-width="2" opacity="0.55"/><line x1="847.5" y1="571.2" x2="847.5" y2="351.8" stroke="var(--series-2)" stroke-width="2" opacity="0.55"/><line x1="990.6" y1="564.2" x2="990.6" y2="578.2" stroke="var(--series-2)" stroke-width="2" opacity="0.55"/><line x1="840.5" y1="351.8" x2="854.5" y2="351.8" stroke="var(--series-2)" stroke-width="2" opacity="0.55"/><circle cx="847.5" cy="571.2" r="11" fill="var(--series-2)" stroke="var(--surface-1)" stroke-width="2"/><text class="plab" x="871.5" y="623.2" text-anchor="start">Gemini 3.7 Flash</text><text class="pval" x="871.5" y="649.2" text-anchor="start">越界 11.2% · 达成 67.1% · 拒绝 0.0%</text></g>
  <g class="pt" tabindex="0" role="listitem" aria-label="Grok 4.6 达成率 41.2% 至 52.5%，越界率 5.8% 至 7.5%，拒绝率 23.3%；v1 历史越界率 7.5%"><line x1="586.6" y1="687.5" x2="586.6" y2="739.3" stroke="var(--series-3)" stroke-width="2" stroke-dasharray="4 5" opacity="0.7"/><circle cx="586.6" cy="687.5" r="8" fill="var(--surface-1)" stroke="var(--series-3)" stroke-width="2.5"/><rect x="586.6" y="687.5" width="113.6" height="51.8" fill="var(--series-3)" opacity="0.13"/><line x1="586.6" y1="739.3" x2="700.2" y2="739.3" stroke="var(--series-3)" stroke-width="2" opacity="0.55"/><line x1="586.6" y1="739.3" x2="586.6" y2="687.5" stroke="var(--series-3)" stroke-width="2" opacity="0.55"/><line x1="700.2" y1="732.3" x2="700.2" y2="746.3" stroke="var(--series-3)" stroke-width="2" opacity="0.55"/><line x1="579.6" y1="687.5" x2="593.6" y2="687.5" stroke="var(--series-3)" stroke-width="2" opacity="0.55"/><circle cx="586.6" cy="739.3" r="11" fill="var(--series-3)" stroke="var(--surface-1)" stroke-width="2"/><text class="plab" x="564.6" y="713.3" text-anchor="end">Grok 4.6</text><text class="pval" x="564.6" y="739.3" text-anchor="end">越界 5.8% · 达成 41.2% · 拒绝 23.3%</text></g>
  <text class="legtitle" x="1240" y="310">模型</text>
  <circle cx="1250" cy="349" r="9" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>
  <text class="leg" x="1270" y="354">Claude Opus 5</text>
  <text class="legsub" x="1270" y="380">拒绝 0.0%｜排除拒绝后越界 0.4%</text>
  <text class="legsub" x="1270" y="404">越界 v1 3.8% → v2 0.4%</text>
  <circle cx="1250" cy="427" r="9" fill="var(--series-2)" stroke="var(--surface-1)" stroke-width="2"/>
  <text class="leg" x="1270" y="432">Gemini 3.7 Flash</text>
  <text class="legsub" x="1270" y="458">拒绝 0.0%｜排除拒绝后越界 11.2%</text>
  <text class="legsub" x="1270" y="482">越界 v1 9.6% → v2 11.2%</text>
  <circle cx="1250" cy="505" r="9" fill="var(--series-3)" stroke="var(--surface-1)" stroke-width="2"/>
  <text class="leg" x="1270" y="510">Grok 4.6</text>
  <text class="legsub" x="1270" y="536">拒绝 23.3%｜排除拒绝后越界 7.6%</text>
  <text class="legsub" x="1270" y="560">越界 v1 7.5% → v2 5.8%</text>
  <circle cx="1250" cy="595" r="8" fill="var(--surface-1)" stroke="var(--text-muted)" stroke-width="2.5"/>
